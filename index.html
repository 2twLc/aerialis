
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e0f5ff">
<title>AERIALIS | Plot Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@400;500;700&family=Michroma&family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#dff4ff;
  --ink:#183b50;
  --muted:#607f91;
  --cyan:#3fb7eb;
  --pink:#f58db6;
  --orbit:"Orbitron",sans-serif;
  --raj:"Rajdhani",sans-serif;
  --mich:"Michroma",sans-serif;
  --jp:"Kaisei Tokumin",serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}

body{
  position:fixed;
  inset:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--jp);
  -webkit-tap-highlight-color:transparent;
}

button{
  font:inherit;
  cursor:pointer;
}

button:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:4px;
}

#app{
  position:fixed;
  inset:0;
  height:100dvh;
  overflow:hidden;
  isolation:isolate;
}

.screen{
  position:absolute;
  inset:0;
  overflow:hidden;
  opacity:0;
  visibility:hidden;
  pointer-events:none;

  background-color:var(--bg);
  background-image:radial-gradient(
    circle,
    rgba(95,170,207,.115) 1.35px,
    transparent 1.7px
  );
  background-size:34px 34px;

  transition:
    opacity .63s ease,
    visibility .63s ease;
}

.screen.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.ambient{
  position:absolute;
  inset:-25%;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse at 20% 23%,
      rgba(255,255,255,.56),
      transparent 39%
    ),
    radial-gradient(
      ellipse at 88% 75%,
      rgba(162,217,246,.26),
      transparent 47%
    );

  animation:ambientDrift 16s ease-in-out infinite alternate;
}

@keyframes ambientDrift{
  to{
    transform:translate3d(3%,-2%,0) scale(1.06);
  }
}

/* =========================
   ANIMATED WAVE LOGO
========================= */

.wave-svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
}

.wave-top,
.wave-bottom{
  fill:none;
  stroke-width:9.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.wave-top{stroke:var(--cyan)}
.wave-bottom{stroke:var(--pink)}

.wave-logo{
  position:relative;
  display:block;
  flex:none;
}

.wave-logo.large{
  width:112px;
  height:65px;
}

.wave-logo.small{
  width:48px;
  height:29px;
}

.wave-logo.card-size{
  width:65px;
  height:39px;
}

.wave-logo::after{
  content:"";
  position:absolute;
  inset:12% -16%;
  z-index:-1;

  background:radial-gradient(
    ellipse,
    rgba(255,255,255,.66),
    transparent 70%
  );

  pointer-events:none;
}

/* =========================
   TRANSITIONS
========================= */

#softWipe{
  position:absolute;
  inset:0;
  z-index:50;
  opacity:0;
  pointer-events:none;
  background:#f7fdff;
  visibility:hidden;
}

#softWipe.play{
  visibility:visible;
  animation:softWipe 1s ease-in-out both;
}

@keyframes softWipe{
  0%{opacity:0}
  43%,56%{opacity:1}
  100%{opacity:0}
}

@keyframes contentIn{
  from{
    opacity:0;
    transform:translateY(20px);
    filter:blur(4px);
  }
  to{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(24px) scale(.975);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* =========================
   LOADING
========================= */

#loading{
  background-color:#e1f5ff;
}

.loading-main{
  position:absolute;
  top:37%;
  left:10%;
  right:10%;

  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.intro-title{
  margin:22px 0 0;

  font:800 clamp(27px,7.8vw,43px)/1.35 var(--orbit);
  letter-spacing:.16em;
  text-indent:.16em;
  color:#173949;
}

.intro-subtitle{
  margin-top:16px;

  font:500 clamp(9px,2.4vw,14px)/1.6 var(--mich);
  letter-spacing:.27em;
  text-indent:.27em;
  color:#698798;
  white-space:nowrap;
}

.loader{
  margin-top:70px;
  width:min(100%,380px);
  text-align:left;
}

.loader-track{
  position:relative;
  height:13px;
  padding:2px;
  overflow:hidden;
  border-radius:20px;

  border:1px solid rgba(111,180,216,.37);
  background:rgba(255,255,255,.96);

  box-shadow:0 2px 12px rgba(84,163,201,.11);
}

.loader-fill{
  height:100%;
  width:0%;
  border-radius:15px;

  background:linear-gradient(
    90deg,
    #38b9eb 0%,
    #90b5e9 55%,
    #f686b2 100%
  );

  box-shadow:0 0 11px rgba(242,137,193,.32);
  transition:width .085s linear;
}

.loader-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:17px;

  color:#607e90;
  font:500 15px var(--mich);
  letter-spacing:.17em;
}

.loader-info strong{
  font-weight:500;
  letter-spacing:.13em;
  font-variant-numeric:tabular-nums;
}

.skip-intro{
  position:absolute;
  z-index:4;
  right:6%;
  top:calc(25px + var(--safe-top));

  padding:9px 8px;
  border:0;
  background:transparent;

  color:rgba(73,119,148,.69);
  font:700 12px var(--raj);
  letter-spacing:.16em;
}

.skip-intro:active{
  color:#177fb3;
}

/* =========================
   HEADER / CLOCK / WEATHER
========================= */

.site-header{
  position:absolute;
  z-index:10;
  top:calc(25px + var(--safe-top));
  left:7%;
  right:7%;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:9px;
}

.site-brand{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.site-brand strong{
  font:800 clamp(13px,3.5vw,17px) var(--orbit);
  letter-spacing:.055em;
  white-space:nowrap;
}

.header-weather-time{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:6px;
  flex:none;
  color:#557d93;
  white-space:nowrap;
}

.weather-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:22px;
  height:22px;
  color:#4399c5;
  flex:none;
}

.weather-icon svg{
  display:block;
  width:100%;
  height:100%;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.live-clock{
  font:700 clamp(11px,3vw,13px)/1 var(--raj);
  letter-spacing:.045em;
  font-variant-numeric:tabular-nums;
}

.header-actions{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:3px;
}

.site-footer{
  position:absolute;
  z-index:9;
  left:7%;
  right:7%;
  bottom:calc(22px + var(--safe-bottom));

  display:flex;
  align-items:center;
  justify-content:space-between;

  font:600 11px var(--raj);
  letter-spacing:.1em;
  color:#7d9cae;
}

/* =========================
   MAIN MENU
========================= */

#home{
  background-color:#e0f4ff;
}

.home-hero{
  position:absolute;
  z-index:5;
  left:7%;
  right:7%;
  top:15.2%;
  pointer-events:none;
}

.home-eyebrow{
  font:600 11px var(--raj);
  letter-spacing:.2em;
  color:#579bc3;
}

.home-hero h2{
  margin:13px 0 12px;

  font:800 clamp(28px,7.8vw,44px)/1.13 var(--orbit);
  letter-spacing:-.06em;
  color:#153f56;
}

.home-hero h2 span{
  color:#60a9ce;
}

.home-hero p{
  margin:0;
  width:47%;

  color:#66899f;
  font:600 clamp(10px,2.7vw,12px)/1.6 var(--raj);
  letter-spacing:.09em;
}

#home.active .home-hero{
  animation:contentIn .75s both;
}

/* =========================
   MASCOT
========================= */

.home-mascot{
  position:absolute;
  z-index:6;
  right:2.5%;
  top:14.7%;
  width:clamp(190px,53vw,275px);
  aspect-ratio:1;

  border:0;
  background:none;
  padding:0;
  overflow:visible;

  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}

.mascot-float{
  position:absolute;
  inset:0;
  pointer-events:none;

  animation:mascotFloat 4.7s ease-in-out infinite;
  transform-origin:50% 75%;

  filter:drop-shadow(
    0 12px 9px rgba(45,128,167,.14)
  );
}

.mascot-bounce{
  display:block;
  width:100%;
  height:100%;
  transform-origin:50% 78%;
}

.mascot-img{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  image-rendering:auto;

  pointer-events:none;
  -webkit-user-drag:none;
}

/* Continuous floating movement */

@keyframes mascotFloat{
  0%,100%{
    transform:translateY(0) rotate(-1deg);
  }
  50%{
    transform:translateY(-7px) rotate(1deg);
  }
}

/* Bounce occurs on an independent layer */

.home-mascot.pop .mascot-bounce{
  animation:boing .94s ease-in-out both;
}

@keyframes boing{
  0%{
    transform:translateY(0) scale(1,1);
  }
  13%{
    transform:translateY(7px) scale(1.10,.89);
  }
  31%{
    transform:translateY(-22px) scale(.92,1.10) rotate(2deg);
  }
  51%{
    transform:translateY(-6px) scale(1.04,.97) rotate(-1deg);
  }
  68%{
    transform:translateY(3px) scale(.985,1.02);
  }
  82%{
    transform:translateY(-2px) scale(1.009,.995);
  }
  92%{
    transform:translateY(.7px) scale(.998,1.003);
  }
  100%{
    transform:translateY(0) scale(1,1);
  }
}

.sparkles{
  position:absolute;
  inset:0;
  overflow:visible;
  pointer-events:none;
}

.spark{
  position:absolute;
  left:var(--x);
  top:var(--y);
  width:var(--size);
  height:var(--size);

  background:var(--color);

  clip-path:polygon(
    50% 0,
    61% 38%,
    100% 50%,
    61% 62%,
    50% 100%,
    39% 62%,
    0 50%,
    39% 38%
  );

  filter:drop-shadow(0 0 5px #fff);

  animation:sparkOut var(--duration)
    ease-out var(--delay) both;
}

@keyframes sparkOut{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.1);
  }
  25%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.2);
  }
  60%{
    opacity:1;
  }
  100%{
    opacity:0;
    transform:translate(
      calc(-50% + var(--dx)),
      calc(-50% + var(--dy))
    ) rotate(120deg) scale(.15);
  }
}

/* =========================
   DIRECTORY CARDS
========================= */

.directory{
  position:absolute;
  z-index:8;
  left:7%;
  right:7%;
  top:43%;
  bottom:11%;

  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:12px;
}

.entry{
  position:relative;
  min-width:0;
  min-height:0;
  overflow:hidden;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  padding:14px;
  border:1px solid rgba(255,255,255,.95);
  border-radius:14px;

  background:rgba(255,255,255,.77);

  box-shadow:
    0 13px 32px rgba(58,136,176,.105),
    0 2px 7px rgba(61,126,161,.045);

  color:#1d455b;
  text-align:left;

  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);

  transition:
    transform .25s,
    box-shadow .25s,
    background .25s;
}

.entry::before{
  content:"";
  position:absolute;
  top:0;
  left:17px;
  right:17px;
  height:3px;

  border-radius:0 0 8px 8px;

  background:linear-gradient(
    90deg,
    rgba(65,182,235,.77),
    rgba(240,146,191,.75)
  );
}

.entry:active{
  transform:scale(.965);
  background:#fff;
}

.entry-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:4px;
}

.entry-index{
  font:700 10px var(--raj);
  letter-spacing:.015em;
  color:#73a3bc;
  white-space:nowrap;
}

.entry .wave-logo{
  opacity:.78;
  transform:translate(5px,-1px);
}

.entry-title{
  position:relative;
  display:block;
  z-index:1;
  margin-bottom:5px;
  padding-right:22px;
}

.entry-title strong{
  display:block;
  font:800 clamp(12px,3.2vw,19px)/1.25 var(--orbit);
  letter-spacing:-.04em;
  overflow-wrap:anywhere;
}

.entry-title small{
  display:block;
  margin-top:9px;
  font:600 11px/1.25 var(--raj);
  letter-spacing:.085em;
  color:#8ba7b7;
}

.entry-arrow{
  position:absolute;
  right:13px;
  bottom:12px;
  color:#68a6ca;
  font:600 22px/1 var(--raj);
}

#home.active .entry{
  animation:cardIn .63s both;
}

#home.active .entry:nth-child(2){
  animation-delay:.09s;
}

#home.active .entry:nth-child(3){
  animation-delay:.18s;
}

#home.active .entry:nth-child(4){
  animation-delay:.27s;
}

/* =========================
   DETAIL PAGES
========================= */

#detail{
  background-color:#e1f5ff;
}

.back-button{
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px 4px;
  border:0;
  background:none;
  color:#447e9e;

  font:700 13px var(--raj);
  letter-spacing:.09em;
}

.back-button .back-arrow{
  font-size:21px;
  line-height:.7;
}

.detail-scroll{
  position:absolute;
  top:calc(101px + var(--safe-top));
  bottom:calc(30px + var(--safe-bottom));
  left:7%;
  right:7%;

  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;

  padding:6px 0 34px;
}

.detail-kicker{
  font:700 12px var(--raj);
  letter-spacing:.19em;
  color:#579ec1;
}

.detail-title{
  margin:16px 0 12px;

  font:800 clamp(26px,7.9vw,53px)/1.1 var(--orbit);
  letter-spacing:-.05em;
  overflow-wrap:anywhere;
}

.detail-subtitle{
  color:#7f9cab;
  font:500 10px/1.7 var(--mich);
  letter-spacing:.04em;
}

.detail-paper{
  position:relative;
  margin-top:30px;
  padding:27px 22px 30px;

  border:1px solid rgba(255,255,255,.95);
  border-radius:18px;

  background:rgba(255,255,255,.78);
  box-shadow:0 17px 36px rgba(60,130,175,.1);

  overflow:hidden;
}

.detail-paper::before{
  content:"";
  position:absolute;
  top:0;
  left:22px;
  right:22px;
  height:3px;

  background:linear-gradient(
    90deg,
    var(--cyan),
    var(--pink)
  );

  border-radius:0 0 6px 6px;
}

.detail-paper .wave-logo{
  margin-bottom:24px;
  opacity:.83;
}

.detail-paper p{
  margin:0;
  white-space:pre-line;

  font:400 13px/2.35 var(--jp);
  color:#355c71;
}

.archive-empty{
  margin-top:22px;
  padding:18px 15px;

  border:1px dashed rgba(95,161,199,.36);
  border-radius:10px;

  background:rgba(229,246,255,.55);

  color:#7b9bab;
  font:600 12px/1.7 var(--raj);
  letter-spacing:.09em;
}

.detail-bottom{
  margin-top:22px;
  display:flex;
  justify-content:space-between;

  color:#8aa9bb;
  font:700 11px var(--raj);
  letter-spacing:.1em;
}

#detail.active .detail-scroll{
  animation:contentIn .62s both;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:365px){
  .site-brand{
    gap:5px;
  }

  .wave-logo.small{
    width:39px;
    height:26px;
  }

  .site-brand strong{
    font-size:12px;
  }

  .header-weather-time{
    gap:4px;
  }

  .weather-icon{
    width:18px;
    height:18px;
  }

  .live-clock{
    font-size:11px;
    letter-spacing:0;
  }
}

@media(max-height:720px){
  .loading-main{
    top:31%;
  }

  .loader{
    margin-top:48px;
  }

  .home-hero{
    top:13%;
  }

  .home-hero h2{
    font-size:clamp(25px,7.1vw,38px);
  }

  .home-mascot{
    top:12.5%;
    width:clamp(160px,48vw,242px);
  }

  .directory{
    top:42%;
    bottom:10%;
    gap:9px;
  }

  .entry{
    padding:11px;
    border-radius:11px;
  }

  .entry .wave-logo{
    width:50px;
    height:31px;
  }

  .entry-title small{
    margin-top:6px;
  }

  .site-footer{
    bottom:calc(12px + var(--safe-bottom));
  }
}

@media(max-height:580px){
  .home-hero{
    top:11%;
  }

  .home-mascot{
    width:39vw;
    top:11%;
  }

  .home-hero p{
    display:none;
  }

  .directory{
    top:37%;
    bottom:9%;
  }

  .entry-title small{
    display:none;
  }
}

@media(min-width:700px){
  .site-header,
  .site-footer,
  .home-hero,
  .directory,
  .detail-scroll{
    left:12%;
    right:12%;
  }

  .directory{
    max-width:820px;
    margin-inline:auto;
    gap:18px;
  }

  .home-mascot{
    right:16%;
    width:min(31vw,310px);
  }

  .home-hero h2{
    font-size:clamp(40px,6vw,72px);
  }

  .detail-scroll{
    max-width:730px;
    margin-inline:auto;
  }
}

@media(prefers-reduced-motion:reduce){
  .ambient,
  .mascot-float{
    animation:none!important;
  }

  .screen{
    transition:none;
  }
}
</style>
</head>

<body>
<div id="app">

<!-- =========================
     LOADING
========================= -->

<section class="screen active" id="loading" aria-hidden="false">

  <div class="ambient"></div>

  <button
    class="skip-intro"
    type="button"
    id="skipIntro"
  >
    SKIP
  </button>

  <div class="loading-main">

    <div class="wave-logo large" aria-hidden="true">
      <svg
        class="wave-svg"
        viewBox="0 0 150 64"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path class="wave-top"></path>
        <path class="wave-bottom"></path>
      </svg>
    </div>

    <h1 class="intro-title">
      NITU
    </h1>

    <div class="intro-subtitle">
      PLOT ARCHIVE
    </div>

    <div
      class="loader"
      role="progressbar"
      id="progressTrack"
      aria-label="サイトを読み込み中"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >

      <div class="loader-track">
        <div
          class="loader-fill"
          id="loaderFill"
        ></div>
      </div>

      <div class="loader-info">
        <span>LOADING</span>
        <strong id="loaderNumber">0%</strong>
      </div>

    </div>

  </div>

</section>

<!-- =========================
     MAIN MENU
========================= -->

<section class="screen" id="home" aria-hidden="true">

  <div class="ambient"></div>

  <header class="site-header">

    <div class="site-brand">

      <span class="wave-logo small" aria-hidden="true">
        <svg class="wave-svg" viewBox="0 0 150 64">
          <path class="wave-top"></path>
          <path class="wave-bottom"></path>
        </svg>
      </span>

      <strong>AERIALIS</strong>

    </div>

    <div
      class="header-weather-time"
      aria-label="福岡県吉富町の時刻と天気"
    >
      <span
        class="weather-icon"
        title="吉富町の天気を取得中"
        aria-label="天気を取得中"
      ></span>

      <time class="live-clock">
        00:00:00
      </time>
    </div>

  </header>

<!-- =========================

========================= -->

<section class="screen" id="detail" aria-hidden="true">

  <div class="ambient"></div>

  <header class="site-header">

    <div class="site-brand">

      <span class="wave-logo small" aria-hidden="true">
        <svg class="wave-svg" viewBox="0 0 150 64">
          <path class="wave-top"></path>
          <path class="wave-bottom"></path>
        </svg>
      </span>

      <strong>AERIALIS</strong>

    </div>

    <div class="header-actions">

      <div
        class="header-weather-time"
        aria-label="福岡県吉富町の時刻と天気"
      >

        <span
          class="weather-icon"
          title="吉富町の天気を取得中"
          aria-label="天気を取得中"
        ></span>

        <time class="live-clock">
          00:00:00
        </time>

      </div>

      <button
        class="back-button"
        id="backButton"

        id="detailEmpty"

      >

      </div>

    </article>

      <span>AERIALIS / PLOT ARCHIVE</span>

      <span id="detailPageNumber">
        01 / 04
      </span>

    </div>

  </div>

<div id="softWipe"></div>

</div>

<script>
"use strict";

/* =========================
   MOBILE SETTINGS
========================= */

for(const name of [
  "gesturestart",
  "gesturechange",
  "gestureend"
]){
  document.addEventListener(
    name,
    e=>e.preventDefault(),
    {passive:false}
  );
}

document.addEventListener(
  "touchmove",
  e=>{
    if(e.touches.length>1){
      e.preventDefault();
    }
  },
  {passive:false}
);

document.addEventListener(
  "dblclick",
  e=>e.preventDefault()
);

/* =========================
   UTILITIES
========================= */

const $=id=>document.getElementById(id);

const TAU=Math.PI*2;

const clamp=(value,min,max)=>{
  return Math.min(
    max,
    Math.max(min,value)
  );
};

/* =========================
   REALTIME JAPAN CLOCK
========================= */

const jstClock=new Intl.DateTimeFormat(
  "ja-JP",
  {
    timeZone:"Asia/Tokyo",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hourCycle:"h23"
  }
);

function updateClock(){

  const value=jstClock.format(
    new Date()
  );

  document.querySelectorAll(
    ".live-clock"
  ).forEach(el=>{
    el.textContent=value;
  });

}

updateClock();

setInterval(
  updateClock,
  1000
);

/* =========================
   YOSHITOMI WEATHER
========================= */

/*
  Yoshitomi Town, Chikujo District,
  Fukuoka Prefecture, Japan.

  Approximate coordinates:
  33.6 N / 131.1667 E

  Open-Meteo current weather data.
*/

const weatherURL=
  "https://api.open-meteo.com/v1/forecast"+
  "?latitude=33.6"+
  "&longitude=131.1667"+
  "&current=weather_code,is_day"+
  "&timezone=Asia%2FTokyo"+
  "&forecast_days=1";

const weatherSlots=[
  ...document.querySelectorAll(
    ".weather-icon"
  )
];

function iconMarkup(code,isDay){

  const sun=
    '<circle cx="12" cy="12" r="4"/>'+
    '<path d="M12 2v2 M12 20v2 M4.93 4.93l1.42 1.42 M17.65 17.65l1.42 1.42 M2 12h2 M20 12h2 M4.93 19.07l1.42-1.42 M17.65 6.35l1.42-1.42"/>';

  const moon=
    '<path d="M20.2 15.6A8.5 8.5 0 0 1 8.4 3.8a8.6 8.6 0 1 0 11.8 11.8Z"/>';

  const cloud=
    '<path d="M6.2 18.2h11.3a4 4 0 0 0 .2-8 5.8 5.8 0 0 0-11.1-1.2 4.7 4.7 0 0 0-.4 9.2Z"/>';

  const partCloud=
    '<path d="M7.4 7.5a4 4 0 0 1 7.8 1.4"/>'+
    '<path d="M4 6h1 M10 1.8v1.1 M3.5 2.9l.8.8"/>'+
    '<path d="M6.3 18.5h11.4a4.1 4.1 0 0 0-.2-8.2 5.4 5.4 0 0 0-10.4-.8 4.7 4.7 0 0 0-.8 9Z"/>';

  let title="";
  let shapes="";

  if(code===0){

    title=isDay?"晴れ":"快晴";
    shapes=isDay?sun:moon;

  }else if(
    code===1||
    code===2
  ){

    title="晴れ時々曇り";
    shapes=isDay
      ?partCloud
      :moon+cloud;

  }else if(code===3){

    title="曇り";
    shapes=cloud;

  }else if(
    code===45||
    code===48
  ){

    title="霧";

    shapes=cloud+
      '<path d="M3 20.5h18 M6 23h12"/>';

  }else if(
    [51,53,55,56,57].includes(code)
  ){

    title="小雨";

    shapes=cloud+
      '<path d="M8 20.5l-1 2 M13 20.5l-1 2"/>';

  }else if(
    [61,63,65,66,67,80,81,82].includes(code)
  ){

    title="雨";

    shapes=cloud+
      '<path d="M8 20l-1 2.5 M13 20l-1 2.5 M18 20l-1 2.5"/>';

  }else if(
    [71,73,75,77,85,86].includes(code)
  ){

    title="雪";

    shapes=cloud+
      '<path d="M9 20v3 M7.5 21.5h3 M16 20v3 M14.5 21.5h3"/>';

  }else if(
    [95,96,99].includes(code)
  ){

    title="雷雨";

    shapes=cloud+
      '<path d="M13 19l-3 3h3l-1 2"/>';

  }else{

    title="天気情報なし";

    shapes=
      '<circle cx="12" cy="12" r="9"/>'+
      '<path d="M12 7.5v5 M12 16.5h.01"/>';

  }

  const svg=
    '<svg viewBox="0 0 24 24" aria-hidden="true">'+
    shapes+
    '</svg>';

  return {
    title,
    svg
  };

}

function setWeather(code,isDay,failed=false){

  const info=iconMarkup(
    code,
    isDay
  );

  weatherSlots.forEach(slot=>{

    slot.innerHTML=info.svg;

    const label=failed
      ?"吉富町の天気を取得できません"
      :"吉富町："+info.title;

    slot.setAttribute(
      "aria-label",
      label
    );

    slot.title=label;

  });

}

let lastWeatherRequest=0;

async function updateWeather(){

  if(
    Date.now()-lastWeatherRequest<
    60*1000
  ){
    return;
  }

  lastWeatherRequest=Date.now();

  const controller=new AbortController();

  const timeout=setTimeout(
    ()=>controller.abort(),
    10000
  );

  try{

    const response=await fetch(
      weatherURL,
      {
        signal:controller.signal,
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error(
        "Weather request failed"
      );
    }

    const data=await response.json();

    const code=data?.current?.weather_code;

    if(!Number.isFinite(code)){
      throw new Error(
        "Weather data missing"
      );
    }

    setWeather(
      code,
      data.current.is_day===1
    );

  }catch(error){

    setWeather(
      -1,
      true,
      true
    );

  }finally{

    clearTimeout(timeout);

  }

}

/* Initial weather request */

setWeather(-1,true,true);

updateWeather();

/* Refresh approximately every 20 minutes */

setInterval(
  updateWeather,
  20*60*1000
);

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      !document.hidden&&
      Date.now()-lastWeatherRequest>
      20*60*1000
    ){

      updateClock();
      updateWeather();

    }

  }
);

/* =========================
   SCREEN MANAGEMENT
========================= */

const screens={
  loading:$("loading"),
  home:$("home"),
  detail:$("detail")
};

let current="loading";
let transitioning=false;

function setScreen(name){

  for(const [key,el] of Object.entries(screens)){

    const active=key===name;

    el.classList.toggle(
      "active",
      active
    );

    el.setAttribute(
      "aria-hidden",
      String(!active)
    );

    el.inert=!active;

  }

  current=name;

}

function changeScreen(name){

  if(
    transitioning||
    current===name
  ){
    return;
  }

  transitioning=true;

  const veil=$("softWipe");

  veil.classList.remove("play");

  void veil.offsetWidth;

  veil.classList.add("play");

  setTimeout(()=>{
    setScreen(name);
  },430);

  setTimeout(()=>{

    transitioning=false;

    veil.classList.remove("play");

  },1040);

}

/* =========================
   ANIMATED WAVES
========================= */

const waveGraphics=[
  ...document.querySelectorAll(
    ".wave-svg"
  )
];

function sinePath(baseY,phase){

  let result="";
  const points=46;

  for(let i=0;i<=points;i++){

    const x=7+i*136/points;

    const y=
      baseY+
      6.8*Math.sin(
        i/points*TAU*2.25+phase
      );

    result+=
      (i===0?"M":" L")+
      x.toFixed(2)+
      " "+
      y.toFixed(2);

  }

  return result;

}

let lastWave=0;

const reducedMotion=window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

function drawWave(time){

  const phase=reducedMotion
    ?0
    :time*.0022;

  const top=sinePath(
    18,
    phase
  );

  const bottom=sinePath(
    45,
    phase+.33
  );

  for(const svg of waveGraphics){

    if(!svg.closest(".active")){
      continue;
    }

    svg.querySelector(
      ".wave-top"
    ).setAttribute("d",top);

    svg.querySelector(
      ".wave-bottom"
    ).setAttribute("d",bottom);

  }

}

function waveLoop(t){

  requestAnimationFrame(waveLoop);

  if(
    document.hidden||
    t-lastWave<30
  ){
    return;
  }

  lastWave=t;

  drawWave(t);

}

drawWave(0);

requestAnimationFrame(waveLoop);

/* =========================
   LOADING
========================= */

let loadFinished=false;
let loadStarted=0;

const loadDuration=4000;

function endLoading(){

  if(loadFinished){
    return;
  }

  loadFinished=true;

  $("loaderFill").style.width="100%";

  $("loaderNumber").textContent="100%";

  $("progressTrack").setAttribute(
    "aria-valuenow",
    "100"
  );

  changeScreen("home");

}

function loadFrame(time){

  if(loadFinished){
    return;
  }

  if(!loadStarted){
    loadStarted=time;
  }

  const progress=clamp(
    (time-loadStarted)/loadDuration,
    0,
    1
  );

  const percent=Math.round(
    progress*100
  );

  $("loaderFill").style.width=
    percent+"%";

  $("loaderNumber").textContent=
    percent+"%";

  $("progressTrack").setAttribute(
    "aria-valuenow",
    String(percent)
  );

  if(progress===1){

    setTimeout(
      endLoading,
      240
    );

  }else{

    requestAnimationFrame(
      loadFrame
    );

  }

}

requestAnimationFrame(loadFrame);

$("skipIntro").addEventListener(
  "click",
  endLoading
);

/* =========================
   ARCHIVE CONTENT
========================= */

const pages=[
  {
    kicker:"SECTION 01 / PROFILE",
    title:"ABOUT",
    subtitle:"ABOUT THIS ARCHIVE",

    text:
      "AERIALISへようこそ。\n\n"+
      "ここは、キャラクターや物語、イラストを集めた個人アーカイブです。\n\n"+
      "好きな世界を、好きな形で残していく場所。",

    empty:false
  },

  {
    kicker:"SECTION 02 / PEOPLE",
    title:"CHARACTERS",
    subtitle:"CHARACTER PROFILES",

    text:
      "キャラクターのプロフィール、設定、関係性をまとめるページです。\n\n"+
      "これからキャラクターの一覧や個別ページを追加できます。",

    empty:true
  },

  {
    kicker:"SECTION 03 / WRITING",
    title:"STORIES",
    subtitle:"STORY COLLECTION",

    text:
      "物語や世界観、エピソードをまとめるページです。\n\n"+
      "ここにストーリーの一覧や各作品の記録を追加できます。",

    empty:true
  },

  {
    kicker:"SECTION 04 / VISUALS",
    title:"GALLERY",
    subtitle:"IMAGE COLLECTION",

    text:
      "イラストや画像を展示するギャラリーです。\n\n"+
      "作品ごとのアルバムやサムネイル一覧を追加できます。",

    empty:true
  }
];

function openCategory(index){

  if(
    current!=="home"||
    transitioning||
    !pages[index]
  ){
    return;
  }

  const page=pages[index];

  $("detailKicker").textContent=
    page.kicker;

  $("detailTitle").textContent=
    page.title;

  $("detailSubtitle").textContent=
    page.subtitle;

  $("detailText").textContent=
    page.text;

  $("detailPageNumber").textContent=
    String(index+1).padStart(2,"0")+
    " / 04";

  $("detailEmpty").hidden=
    !page.empty;

  $("detailScroll").scrollTop=0;

  changeScreen("detail");

}

document.querySelectorAll(
  "[data-page]"
).forEach(button=>{

  button.addEventListener(
    "click",
    ()=>{

      openCategory(
        Number(button.dataset.page)
      );

    }
  );

});

/* RETURN TO MENU */

$("backButton").addEventListener(
  "click",
  ()=>{

    if(current==="detail"){
      changeScreen("home");
    }

  }
);

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="Escape"&&
      current==="detail"
    ){
      changeScreen("home");
    }

  }
);

/* =========================
   MASCOT ANIMATION
========================= */

const mascot=$("mascotButton");

const sparkleField=$("sparkleField");

const bounceLayer=mascot.querySelector(
  ".mascot-bounce"
);

/*
  Remove the bounce state only after
  the animation settles at its neutral
  position. The floating movement runs
  continuously on the parent layer.
*/

bounceLayer.addEventListener(
  "animationend",
  event=>{

    if(event.animationName==="boing"){

      mascot.classList.remove("pop");

    }

  }
);

mascot.addEventListener(
  "click",
  ()=>{

    if(
      current!=="home"||
      transitioning
    ){
      return;
    }

    if(
      !mascot.classList.contains("pop")
    ){
      mascot.classList.add("pop");
    }

    sparkleField.replaceChildren();

    const colors=[
      "#ffffff",
      "#55c2f1",
      "#f993c0",
      "#b4e5ff"
    ];

    for(let i=0;i<18;i++){

      const el=document.createElement(
        "span"
      );

      el.className="spark";

      const a=
        i/18*TAU+
        (Math.random()-.5)*.32;

      const distance=
        33+Math.random()*48;

      const set=(key,value)=>{
        el.style.setProperty(
          key,
          value
        );
      };

      set(
        "--x",
        (30+Math.random()*40)+"%"
      );

      set(
        "--y",
        (24+Math.random()*49)+"%"
      );

      set(
        "--size",
        (6+Math.random()*8)+"px"
      );

      set(
        "--dx",
        Math.cos(a)*distance+"px"
      );

      set(
        "--dy",
        Math.sin(a)*distance+"px"
      );

      set(
        "--color",
        colors[i%colors.length]
      );

      set(
        "--delay",
        (Math.random()*.12)+"s"
      );

      set(
        "--duration",
        (.55+Math.random()*.32)+"s"
      );

      sparkleField.appendChild(el);

      el.addEventListener(
        "animationend",
        ()=>el.remove(),
        {once:true}
      );

    }

  }
);

/* =========================
   INITIAL STATE
========================= */

setScreen("loading");

</script>
