
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e0f5ff">
<title>AERIALIS | Plot Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@400;500;700&family=Michroma&family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dff4ff;--ink:#183b50;--muted:#607f91;
  --cyan:#3fb7eb;--pink:#f58db6;
  --orbit:"Orbitron",sans-serif;--raj:"Rajdhani",sans-serif;
  --mich:"Michroma",sans-serif;--jp:"Kaisei Tokumin",serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;background:var(--bg);color:var(--ink);font-family:var(--jp);-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden;isolation:isolate}

.screen{
  position:absolute;inset:0;overflow:hidden;
  opacity:0;visibility:hidden;pointer-events:none;
  background-color:var(--bg);
  background-image:radial-gradient(
    circle,rgba(95,170,207,.115) 1.35px,transparent 1.7px
  );
  background-size:34px 34px;
  transition:opacity .63s ease,visibility .63s ease;
}
.screen.active{opacity:1;visibility:visible;pointer-events:auto}

.ambient{
  position:absolute;inset:-25%;pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 23%,rgba(255,255,255,.56),transparent 39%),
    radial-gradient(ellipse at 88% 75%,rgba(162,217,246,.26),transparent 47%);
  animation:ambientDrift 16s ease-in-out infinite alternate;
}
@keyframes ambientDrift{
  to{transform:translate3d(3%,-2%,0) scale(1.06)}
}

/* WAVES */

.wave-svg{display:block;width:100%;height:100%;overflow:visible}
.wave-top,.wave-bottom{
  fill:none;stroke-width:9.5;
  stroke-linecap:round;stroke-linejoin:round;
}
.wave-top{stroke:var(--cyan)}
.wave-bottom{stroke:var(--pink)}
.wave-logo{position:relative;display:block;flex:none}
.wave-logo.large{width:112px;height:65px}
.wave-logo.small{width:48px;height:29px}
.wave-logo.card-size{width:65px;height:39px}
.wave-logo::after{
  content:"";position:absolute;inset:12% -16%;
  z-index:-1;pointer-events:none;
  background:radial-gradient(
    ellipse,rgba(255,255,255,.66),transparent 70%
  );
}

/* TRANSITIONS */

#softWipe{
  position:absolute;inset:0;z-index:50;opacity:0;
  pointer-events:none;background:#f7fdff;visibility:hidden;
}
#softWipe.play{
  visibility:visible;
  animation:softWipe .78s ease-in-out both;
}
@keyframes softWipe{
  0%{opacity:0}
  43%,56%{opacity:1}
  100%{opacity:0}
}
@keyframes contentIn{
  from{opacity:0;transform:translateY(20px);filter:blur(4px)}
  to{opacity:1;transform:translateY(0);filter:blur(0)}
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(24px) scale(.975)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* LOADING */

#loading{background-color:#e1f5ff}
.loading-main{
  position:absolute;top:37%;left:10%;right:10%;
  display:flex;flex-direction:column;
  align-items:center;text-align:center;
}
.intro-title{
  margin:22px 0 0;
  font:800 clamp(27px,7.8vw,43px)/1.35 var(--orbit);
  letter-spacing:.16em;text-indent:.16em;color:#173949;
}
.intro-subtitle{
  margin-top:16px;
  font:500 clamp(9px,2.4vw,14px)/1.6 var(--mich);
  letter-spacing:.27em;text-indent:.27em;
  color:#698798;white-space:nowrap;
}
.loader{
  margin-top:70px;width:min(100%,380px);text-align:left;
}
.loader-track{
  position:relative;height:13px;padding:2px;overflow:hidden;
  border-radius:20px;border:1px solid rgba(111,180,216,.37);
  background:rgba(255,255,255,.96);
  box-shadow:0 2px 12px rgba(84,163,201,.11);
}
.loader-fill{
  height:100%;width:0%;border-radius:15px;
  background:linear-gradient(
    90deg,#38b9eb 0%,#90b5e9 55%,#f686b2 100%
  );
  box-shadow:0 0 11px rgba(242,137,193,.32);
  transition:width .085s linear;
}
.loader-info{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:17px;color:#607e90;
  font:500 15px var(--mich);letter-spacing:.17em;
}
.loader-info strong{
  font-weight:500;letter-spacing:.13em;
  font-variant-numeric:tabular-nums;
}
.skip-intro{
  position:absolute;z-index:4;right:6%;
  top:calc(25px + var(--safe-top));
  padding:9px 8px;border:0;background:transparent;
  color:rgba(73,119,148,.69);
  font:700 12px var(--raj);letter-spacing:.16em;
}
.skip-intro:active{color:#177fb3}

/* HEADER / CLOCK */

.site-header{
  position:absolute;z-index:10;
  top:calc(25px + var(--safe-top));
  left:7%;right:7%;
  display:flex;align-items:center;
  justify-content:space-between;gap:9px;
}
.site-brand{
  display:flex;align-items:center;gap:9px;min-width:0;
}
.site-brand strong{
  font:800 clamp(13px,3.5vw,17px) var(--orbit);
  letter-spacing:.055em;white-space:nowrap;
}
.live-clock{
  font:700 clamp(11px,3vw,13px)/1 var(--raj);
  letter-spacing:.045em;font-variant-numeric:tabular-nums;
}
.header-actions{
  display:flex;flex-direction:column;align-items:flex-end;gap:3px;
}
.site-footer{
  position:absolute;z-index:9;
  left:7%;right:7%;
  bottom:calc(22px + var(--safe-bottom));
  display:flex;align-items:center;
  justify-content:space-between;
  font:600 11px var(--raj);
  letter-spacing:.1em;color:#7d9cae;
}

/* MAIN MENU */

#home{background-color:#e0f4ff}

/* FULL-WIDTH ANNOUNCEMENT BAND */

.notice-bar{
  position:absolute;
  z-index:12;
  top:calc(64px + var(--safe-top));
  left:0;
  right:0;
  width:100%;
  height:33px;
  display:flex;
  align-items:center;
  overflow:hidden;
  border-top:1px solid rgba(188,218,236,.55);
  border-bottom:1px solid rgba(188,218,236,.55);
  border-left:0;
  border-right:0;
  border-radius:0;
  background:#fff;
  box-shadow:0 6px 19px rgba(59,137,171,.065);
}
.notice-window{
  flex:1;min-width:0;overflow:hidden;
  white-space:nowrap;padding-left:7vw;
}
.notice-track{
  display:flex;width:max-content;
  animation:noticeFlow 26s linear infinite;
}
.notice-copy{
  flex:none;padding-right:48px;color:#587e96;
  font:600 12px var(--raj);
  letter-spacing:.035em;white-space:nowrap;
}
@keyframes noticeFlow{
  to{transform:translateX(-50%)}
}

/* UPDATE HISTORY */

.update-panel{
  position:absolute;z-index:7;
  top:calc(106px + var(--safe-top));
  left:7%;width:47%;max-width:280px;
  height:min(240px,calc(43dvh - 130px - var(--safe-top)));
  padding:14px;
  border:1px solid rgba(255,255,255,.88);
  border-radius:12px;
  background:rgba(255,255,255,.65);
  box-shadow:0 12px 30px rgba(71,138,172,.08);
  overflow:hidden;
}
.update-heading{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
  color:#307da7;
  font:700 11px var(--orbit);
  letter-spacing:.04em;white-space:nowrap;
}
.update-heading::before{
  content:"";width:6px;height:6px;flex:none;
  border-radius:50%;background:var(--pink);
}
.update-list{
  height:calc(100% - 27px);
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  scrollbar-width:none;
}
.update-list::-webkit-scrollbar{display:none}
.update-item{
  padding:9px 0 11px;
  border-top:1px solid rgba(92,165,202,.22);
}
.update-date{
  display:block;color:#6d9ab3;
  font:700 11px var(--raj);letter-spacing:.06em;
}
.update-text{
  display:block;margin-top:3px;color:#355e74;
  font:500 12px/1.5 var(--jp);
  overflow-wrap:anywhere;
}
#home.active .update-panel{
  animation:contentIn .75s both;
}

/* MASCOT */

.home-mascot{
  position:absolute;z-index:6;
  right:2.5%;top:17.3%;
  width:clamp(190px,53vw,275px);
  aspect-ratio:1;border:0;
  background:none;padding:0;overflow:visible;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
.mascot-float{
  position:absolute;inset:0;pointer-events:none;
  animation:mascotFloat 4.7s ease-in-out infinite;
  transform-origin:50% 75%;
  filter:drop-shadow(0 12px 9px rgba(45,128,167,.14));
}
.mascot-bounce{
  display:block;width:100%;height:100%;
  transform-origin:50% 78%;
  will-change:transform;
}
.mascot-img{
  width:100%;height:100%;display:block;
  object-fit:contain;image-rendering:auto;
  pointer-events:none;-webkit-user-drag:none;
}
@keyframes mascotFloat{
  0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-7px) rotate(1deg)}
}
.sparkles{
  position:absolute;inset:0;overflow:visible;pointer-events:none;
}
.spark{
  position:absolute;left:var(--x);top:var(--y);
  width:var(--size);height:var(--size);
  background:var(--color);
  clip-path:polygon(
    50% 0,61% 38%,100% 50%,61% 62%,
    50% 100%,39% 62%,0 50%,39% 38%
  );
  filter:drop-shadow(0 0 5px #fff);
  animation:sparkOut var(--duration) ease-out var(--delay) both;
}
@keyframes sparkOut{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.1);
  }
  25%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.2);
  }
  60%{opacity:1}
  100%{
    opacity:0;
    transform:translate(
      calc(-50% + var(--dx)),
      calc(-50% + var(--dy))
    ) rotate(120deg) scale(.15);
  }
}

/* FOUR MENU CARDS */

.directory{
  position:absolute;z-index:8;
  left:7%;right:7%;top:43%;bottom:11%;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:12px;
}
.entry{
  position:relative;min-width:0;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;
  justify-content:space-between;padding:14px;
  border:1px solid rgba(255,255,255,.95);
  border-radius:14px;
  background:rgba(255,255,255,.77);
  box-shadow:
    0 13px 32px rgba(58,136,176,.105),
    0 2px 7px rgba(61,126,161,.045);
  color:#1d455b;text-align:left;
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  transition:transform .25s,box-shadow .25s,background .25s;
}
.entry::before{
  content:"";position:absolute;top:0;left:17px;right:17px;
  height:3px;border-radius:0 0 8px 8px;
  background:linear-gradient(
    90deg,
    rgba(65,182,235,.77),
    rgba(240,146,191,.75)
  );
}
.entry:active{
  transform:scale(.965);background:#fff;
}
.entry-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;gap:4px;
}
.entry-index{
  font:700 10px var(--raj);
  letter-spacing:.015em;
  color:#73a3bc;
  white-space:nowrap;
}
.entry .wave-logo{
  opacity:.78;
  transform:translate(5px,-1px);
}
.entry-title{
  position:relative;display:block;z-index:1;
  margin-bottom:5px;padding-right:22px;
}
.entry-title strong{
  display:block;
  font:800 clamp(12px,3.2vw,19px)/1.25 var(--orbit);
  letter-spacing:-.04em;
  overflow-wrap:anywhere;
}
.entry-title small{
  display:block;margin-top:9px;
  font:600 11px/1.25 var(--raj);
  letter-spacing:.085em;color:#8ba7b7;
}
.entry-arrow{
  position:absolute;right:13px;bottom:12px;
  color:#68a6ca;font:600 22px/1 var(--raj);
}
#home.active .entry{
  animation:cardIn .63s both;
}
#home.active .entry:nth-child(2){
  animation-delay:.09s;
}
#home.active .entry:nth-child(3){
  animation-delay:.18s;
}
#home.active .entry:nth-child(4){
  animation-delay:.27s;
}

/* DETAIL PAGES */

#detail{background-color:#e1f5ff}
.back-button{
  display:flex;align-items:center;gap:7px;
  padding:9px 4px;border:0;background:none;
  color:#447e9e;
  font:700 13px var(--raj);
  letter-spacing:.09em;
}
.back-button .back-arrow{
  font-size:21px;line-height:.7;
}
.detail-scroll{
  position:absolute;
  top:calc(101px + var(--safe-top));
  bottom:calc(30px + var(--safe-bottom));
  left:7%;right:7%;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  padding:6px 0 34px;
}
.detail-kicker{
  font:700 12px var(--raj);
  letter-spacing:.19em;color:#579ec1;
}
.detail-title{
  margin:16px 0 12px;
  font:800 clamp(26px,7.9vw,53px)/1.1 var(--orbit);
  letter-spacing:-.05em;
  overflow-wrap:anywhere;
}
.detail-subtitle{
  color:#7f9cab;
  font:500 10px/1.7 var(--mich);
  letter-spacing:.04em;
}
.detail-paper{
  position:relative;margin-top:30px;
  padding:27px 22px 30px;
  border:1px solid rgba(255,255,255,.95);
  border-radius:18px;
  background:rgba(255,255,255,.78);
  box-shadow:0 17px 36px rgba(60,130,175,.1);
  overflow:hidden;
}
.detail-paper::before{
  content:"";position:absolute;
  top:0;left:22px;right:22px;height:3px;
  background:linear-gradient(90deg,var(--cyan),var(--pink));
  border-radius:0 0 6px 6px;
}
.detail-paper .wave-logo{
  margin-bottom:24px;opacity:.83;
}
.detail-paper p{
  margin:0;white-space:pre-line;
  font:400 13px/2.35 var(--jp);color:#355c71;
}
.archive-empty{
  margin-top:22px;padding:18px 15px;
  border:1px dashed rgba(95,161,199,.36);
  border-radius:10px;
  background:rgba(229,246,255,.55);
  color:#7b9bab;
  font:600 12px/1.7 var(--raj);
  letter-spacing:.09em;
}
.detail-bottom{
  margin-top:22px;
  display:flex;justify-content:space-between;
  color:#8aa9bb;
  font:700 11px var(--raj);
  letter-spacing:.1em;
}
#detail.active .detail-scroll{
  animation:contentIn .62s both;
}

/* RESPONSIVE */

@media(max-width:365px){
  .site-brand{gap:5px}
  .wave-logo.small{width:39px;height:26px}
  .site-brand strong{font-size:12px}
  .live-clock{font-size:11px;letter-spacing:0}
  .update-panel{width:48%;padding:11px}
}
@media(max-height:720px){
  .loading-main{top:31%}
  .loader{margin-top:48px}
  .notice-bar{
    top:calc(62px + var(--safe-top));height:31px;
  }
  .update-panel{
    top:calc(103px + var(--safe-top));
    height:min(170px,calc(42dvh - 122px - var(--safe-top)));
  }
  .home-mascot{
    top:15%;width:clamp(160px,48vw,242px);
  }
  .directory{top:42%;bottom:10%;gap:9px}
  .entry{padding:11px;border-radius:11px}
  .entry .wave-logo{width:50px;height:31px}
  .entry-title small{margin-top:6px}
  .site-footer{
    bottom:calc(12px + var(--safe-bottom));
  }
}
@media(max-height:580px){
  .notice-bar{
    top:calc(58px + var(--safe-top));height:28px;
  }
  .update-panel{
    top:calc(86px + var(--safe-top));
    height:min(112px,calc(37dvh - 102px - var(--safe-top)));
    padding:9px 11px;
  }
  .update-item{padding:4px 0}
  .update-heading{margin-bottom:3px}
  .home-mascot{width:39vw;top:13%}
  .directory{top:37%;bottom:9%}
  .entry-title small{display:none}
}
@media(min-width:700px){
  .site-header,.site-footer,.update-panel,
  .directory,.detail-scroll{
    left:12%;right:12%;
  }
  .notice-bar{left:0;right:0}
  .directory{
    max-width:820px;margin-inline:auto;gap:18px;
  }
  .home-mascot{
    right:16%;width:min(31vw,310px);
  }
  .update-panel{width:300px;max-width:300px}
  .detail-scroll{
    max-width:730px;margin-inline:auto;
  }
}
@media(prefers-reduced-motion:reduce){
  .ambient,.mascot-float,.notice-track{
    animation:none!important;
  }
  .screen{transition:none}
}
</style>
</head>

<body>
<div id="app">

<!-- LOADING -->

<section class="screen active" id="loading" aria-hidden="false">
  <div class="ambient"></div>
  <button class="skip-intro" type="button" id="skipIntro">SKIP</button>
  <div class="loading-main">
    <div class="wave-logo large" aria-hidden="true">
      <svg class="wave-svg" viewBox="0 0 150 64" xmlns="http://www.w3.org/2000/svg">
        <path class="wave-top"></path>
        <path class="wave-bottom"></path>
      </svg>
    </div>
    <h1 class="intro-title">NITU</h1>
    <div class="intro-subtitle">PLOT ARCHIVE</div>
    <div
      class="loader"
      role="progressbar"
      id="progressTrack"
      aria-label="サイトを読み込み中"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <div class="loader-track">
        <div class="loader-fill" id="loaderFill"></div>
      </div>
      <div class="loader-info">
        <span>LOADING</span>
        <strong id="loaderNumber">0%</strong>
      </div>
    </div>
  </div>
</section>

<!-- HOME -->

<section class="screen" id="home" aria-hidden="true">
  <div class="ambient"></div>

  <header class="site-header">
    <div class="site-brand">
      <span class="wave-logo small" aria-hidden="true">
        <svg class="wave-svg" viewBox="0 0 150 64">
          <path class="wave-top"></path>
          <path class="wave-bottom"></path>
        </svg>
      </span>
      <strong>AERIALIS</strong>
    </div>
    <time class="live-clock" aria-label="日本時間">00:00:00</time>
  </header>

  <!-- SCROLLING ANNOUNCEMENTS -->

  <div class="notice-bar" aria-label="お知らせ">
    <div class="notice-window" aria-hidden="true">
      <div class="notice-track" id="noticeTrack"></div>
    </div>
  </div>

  <!-- UPDATE HISTORY -->

  <section class="update-panel" aria-label="更新履歴">
    <div class="update-heading">UPDATE LOG</div>
    <div class="update-list" id="updateList"></div>
  </section>

  <!-- MASCOT -->

  <button
    class="home-mascot"
    type="button"
    id="mascotButton"
    aria-label="キャラクターを跳ねさせる"
  >
    <span class="mascot-float">
      <span class="mascot-bounce">
        <img
          class="mascot-img"
          src="./無題299_20261117135551.png"
          alt="ピンクの髪と白い羽のキャラクター"
          draggable="false"
        >
      </span>
    </span>
    <span class="sparkles" id="sparkleField" aria-hidden="true"></span>
  </button>

  <!-- FOUR CATEGORIES -->

  <nav class="directory" aria-label="アーカイブのメニュー">

    <button class="entry" type="button" data-page="0">
      <span class="entry-top">
        <span class="entry-index">01 / PLOTS</span>
        <span class="wave-logo card-size" aria-hidden="true">
          <svg class="wave-svg" viewBox="0 0 150 64">
            <path class="wave-top"></path>
            <path class="wave-bottom"></path>
          </svg>
        </span>
      </span>
      <span class="entry-title">
        <strong>PLOTS</strong>
        <small>PLOT COLLECTION</small>
      </span>
      <span class="entry-arrow">↗</span>
    </button>

    <button class="entry" type="button" data-page="1">
      <span class="entry-top">
        <span class="entry-index">02 / NOVELS</span>
        <span class="wave-logo card-size" aria-hidden="true">
          <svg class="wave-svg" viewBox="0 0 150 64">
            <path class="wave-top"></path>
            <path class="wave-bottom"></path>
          </svg>
        </span>
      </span>
      <span class="entry-title">
        <strong>NOVELS</strong>
        <small>NOVEL COLLECTION</small>
      </span>
      <span class="entry-arrow">↗</span>
    </button>

    <button class="entry" type="button" data-page="2">
      <span class="entry-top">
        <span class="entry-index">03 / QUESTIONS</span>
        <span class="wave-logo card-size" aria-hidden="true">
          <svg class="wave-svg" viewBox="0 0 150 64">
            <path class="wave-top"></path>
            <path class="wave-bottom"></path>
          </svg>
        </span>
      </span>
      <span class="entry-title">
        <strong>Q&A</strong>
        <small>QUESTIONS &amp; ANSWERS</small>
      </span>
      <span class="entry-arrow">↗</span>
    </button>

    <button class="entry" type="button" data-page="3">
      <span class="entry-top">
        <span class="entry-index">04 / RULES</span>
        <span class="wave-logo card-size" aria-hidden="true">
          <svg class="wave-svg" viewBox="0 0 150 64">
            <path class="wave-top"></path>
            <path class="wave-bottom"></path>
          </svg>
        </span>
      </span>
      <span class="entry-title">
        <strong>GUIDELINES</strong>
        <small>SITE GUIDELINES</small>
      </span>
      <span class="entry-arrow">↗</span>
    </button>

  </nav>

  <footer class="site-footer">
    <span>AN ARCHIVE OF IMAGINATION</span>
    <span>© 2026</span>
  </footer>
</section>

<!-- DETAIL -->

<section class="screen" id="detail" aria-hidden="true">
  <div class="ambient"></div>

  <header class="site-header">
    <div class="site-brand">
      <span class="wave-logo small" aria-hidden="true">
        <svg class="wave-svg" viewBox="0 0 150 64">
          <path class="wave-top"></path>
          <path class="wave-bottom"></path>
        </svg>
      </span>
      <strong>AERIALIS</strong>
    </div>

    <div class="header-actions">
      <time class="live-clock" aria-label="日本時間">00:00:00</time>
      <button class="back-button" id="backButton" type="button">
        <span class="back-arrow">←</span>
        BACK
      </button>
    </div>
  </header>

  <div class="detail-scroll" id="detailScroll">
    <div class="detail-kicker" id="detailKicker">
      SECTION 01 / PLOTS
    </div>

    <h2 class="detail-title" id="detailTitle">PLOTS</h2>

    <div class="detail-subtitle" id="detailSubtitle">
      PLOT COLLECTION
    </div>

    <article class="detail-paper">
      <div class="wave-logo small" aria-hidden="true">
        <svg class="wave-svg" viewBox="0 0 150 64">
          <path class="wave-top"></path>
          <path class="wave-bottom"></path>
        </svg>
      </div>

      <p id="detailText"></p>

      <div class="archive-empty" id="detailEmpty" hidden>
        NO ENTRIES YET / COMING SOON
      </div>
    </article>

    <div class="detail-bottom">
      <span>AERIALIS / PLOT ARCHIVE</span>
      <span id="detailPageNumber">01 / 04</span>
    </div>
  </div>
</section>

<div id="softWipe"></div>
</div>

<script>
"use strict";

/* MOBILE */

for(const name of [
  "gesturestart",
  "gesturechange",
  "gestureend"
]){
  document.addEventListener(
    name,
    e=>e.preventDefault(),
    {passive:false}
  );
}

document.addEventListener(
  "touchmove",
  e=>{
    if(e.touches.length>1){
      e.preventDefault();
    }
  },
  {passive:false}
);

document.addEventListener(
  "dblclick",
  e=>e.preventDefault()
);

/* UTILITIES */

const $=id=>document.getElementById(id);
const TAU=Math.PI*2;

const clamp=(value,min,max)=>{
  return Math.min(max,Math.max(min,value));
};

/* CLOCK */

const jstClock=new Intl.DateTimeFormat(
  "ja-JP",
  {
    timeZone:"Asia/Tokyo",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hourCycle:"h23"
  }
);

function updateClock(){
  const value=jstClock.format(new Date());

  document.querySelectorAll(".live-clock").forEach(el=>{
    el.textContent=value;
  });
}

updateClock();
setInterval(updateClock,1000);

/* ANNOUNCEMENTS / UPDATE HISTORY */

const NOTICES=[
  "NITUへようこそ。",
  "お知らせやサイトの更新情報はこちらでご案内します。"
];

const UPDATES=[
  {
    date:"2026.11.18",
    text:"お知らせ欄を追加しました。"
  },
  {
    date:"2026.11.18",
    text:"サイトの表示を調整しました。"
  }
];

/* RENDER ANNOUNCEMENTS */

function renderAnnouncements(){
  const message=
    NOTICES.join("　 /　 ")+
    "　 /　 ";

  const track=$("noticeTrack");
  track.replaceChildren();

  for(let i=0;i<2;i++){
    const item=document.createElement("span");
    item.className="notice-copy";
    item.textContent=message;
    track.appendChild(item);
  }

  const list=$("updateList");
  list.replaceChildren();

  for(const record of UPDATES){
    const item=document.createElement("div");
    item.className="update-item";

    const date=document.createElement("time");
    date.className="update-date";
    date.textContent=record.date;

    const title=document.createElement("span");
    title.className="update-text";
    title.textContent=record.text;

    item.append(date,title);
    list.appendChild(item);
  }
}

renderAnnouncements();

/* SCREEN MANAGEMENT */

const screens={
  loading:$("loading"),
  home:$("home"),
  detail:$("detail")
};

let current="loading";
let transitioning=false;

function setScreen(name){
  for(const [key,el] of Object.entries(screens)){
    const active=key===name;

    el.classList.toggle("active",active);

    el.setAttribute(
      "aria-hidden",
      String(!active)
    );

    el.inert=!active;
  }

  current=name;
}

function changeScreen(name){
  if(transitioning||current===name)return;

  transitioning=true;

  const veil=$("softWipe");
  veil.classList.remove("play");
  void veil.offsetWidth;
  veil.classList.add("play");

  setTimeout(()=>{
    setScreen(name);
  },330);

  setTimeout(()=>{
    transitioning=false;
    veil.classList.remove("play");
  },815);
}

/* WAVES */

const waveGraphics=[
  ...document.querySelectorAll(".wave-svg")
];

function sinePath(baseY,phase){
  let result="";
  const points=46;

  for(let i=0;i<=points;i++){
    const x=7+i*136/points;

    const y=
      baseY+
      6.8*Math.sin(i/points*TAU*2.25+phase);

    result+=
      (i===0?"M":" L")+
      x.toFixed(2)+" "+y.toFixed(2);
  }

  return result;
}

let lastWave=0;

const reducedMotion=window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

function drawWave(time){
  const phase=reducedMotion?0:time*.0022;

  const top=sinePath(18,phase);
  const bottom=sinePath(45,phase+.33);

  for(const svg of waveGraphics){
    if(!svg.closest(".active"))continue;

    svg.querySelector(".wave-top").setAttribute("d",top);
    svg.querySelector(".wave-bottom").setAttribute("d",bottom);
  }
}

function waveLoop(t){
  requestAnimationFrame(waveLoop);

  if(document.hidden||t-lastWave<30)return;

  lastWave=t;
  drawWave(t);
}

drawWave(0);
requestAnimationFrame(waveLoop);

/* LOADING */

let loadFinished=false;
let loadStarted=0;

const loadDuration=4000;

function endLoading(){
  if(loadFinished)return;

  loadFinished=true;

  $("loaderFill").style.width="100%";
  $("loaderNumber").textContent="100%";

  $("progressTrack").setAttribute(
    "aria-valuenow",
    "100"
  );

  changeScreen("home");
}

function loadFrame(time){
  if(loadFinished)return;

  if(!loadStarted){
    loadStarted=time;
  }

  const progress=clamp(
    (time-loadStarted)/loadDuration,
    0,1
  );

  const percent=Math.round(progress*100);

  $("loaderFill").style.width=percent+"%";
  $("loaderNumber").textContent=percent+"%";

  $("progressTrack").setAttribute(
    "aria-valuenow",
    String(percent)
  );

  if(progress===1){
    setTimeout(endLoading,240);
  }else{
    requestAnimationFrame(loadFrame);
  }
}

requestAnimationFrame(loadFrame);

$("skipIntro").addEventListener(
  "click",
  endLoading
);

/* =========================
   FOUR CATEGORY PAGES

   PLOTS       - プロット・設定まとめ
   NOVELS      - 小説
   Q&A         - 質問と回答
   GUIDELINES  - ガイドライン
========================= */

const pages=[
  {
    kicker:"SECTION 01 / PLOTS",
    title:"PLOTS",
    subtitle:"PLOT COLLECTION",
    text:
      "キャラクターや世界観、物語の設定など、プロットをまとめるページです。\n\n"+
      "今後、作品ごとのプロット一覧を追加できます。",
    empty:true
  },
  {
    kicker:"SECTION 02 / NOVELS",
    title:"NOVELS",
    subtitle:"NOVEL COLLECTION",
    text:
      "小説をまとめるページです。\n\n"+
      "今後、作品一覧や小説の本文を追加できます。",
    empty:true
  },
  {
    kicker:"SECTION 03 / QUESTIONS",
    title:"Q&A",
    subtitle:"QUESTIONS & ANSWERS",
    text:
      "質問と回答をまとめるページです。\n\n"+
      "よくある質問や、作品に関する質問の回答を追加できます。",
    empty:true
  },
  {
    kicker:"SECTION 04 / RULES",
    title:"GUIDELINES",
    subtitle:"SITE GUIDELINES",
    text:
      "サイトの閲覧や作品の取り扱いについて、ガイドラインを掲載するページです。\n\n"+
      "詳しい内容は今後追加できます。",
    empty:true
  }
];

/* CATEGORY NAVIGATION */

function openCategory(index){
  if(
    current!=="home"||
    transitioning||
    !pages[index]
  ){
    return;
  }

  const page=pages[index];

  $("detailKicker").textContent=page.kicker;
  $("detailTitle").textContent=page.title;
  $("detailSubtitle").textContent=page.subtitle;
  $("detailText").textContent=page.text;

  $("detailPageNumber").textContent=
    String(index+1).padStart(2,"0")+" / 04";

  $("detailEmpty").hidden=!page.empty;
  $("detailScroll").scrollTop=0;

  changeScreen("detail");
}

document.querySelectorAll("[data-page]").forEach(button=>{
  button.addEventListener("click",()=>{
    openCategory(Number(button.dataset.page));
  });
});

$("backButton").addEventListener("click",()=>{
  if(current==="detail"){
    changeScreen("home");
  }
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&current==="detail"){
    changeScreen("home");
  }
});

/* MASCOT SPRING */

const mascot=$("mascotButton");
const sparkleField=$("sparkleField");

const bounceLayer=mascot.querySelector(
  ".mascot-bounce"
);

const spring={
  y:0,
  vy:0,
  stretch:0,
  vs:0,
  running:false,
  last:0
};

function bounceFrame(now){
  const dt=spring.last
    ?Math.min((now-spring.last)/16.667,2)
    :1;

  spring.last=now;

  spring.vy+=(
    -.095*spring.y-
    .18*spring.vy
  )*dt;

  spring.y+=spring.vy*dt;

  spring.vs+=(
    -.18*spring.stretch-
    .30*spring.vs
  )*dt;

  spring.stretch+=spring.vs*dt;

  bounceLayer.style.transform=
    `translate3d(0,${spring.y.toFixed(2)}px,0) `+
    `scale(${(1+spring.stretch).toFixed(4)},`+
    `${(1-spring.stretch*.8).toFixed(4)}) `+
    `rotate(${clamp(
      spring.vy*-.27,
      -3.5,
      3.5
    ).toFixed(2)}deg)`;

  const energy=
    Math.abs(spring.y)+
    Math.abs(spring.vy)*3+
    Math.abs(spring.stretch)*80+
    Math.abs(spring.vs)*80;

  if(energy<.08){
    bounceLayer.style.transform="";

    spring.y=0;
    spring.vy=0;
    spring.stretch=0;
    spring.vs=0;

    spring.running=false;
    spring.last=0;
    return;
  }

  requestAnimationFrame(bounceFrame);
}

/* SPARKLES */

function addSparkles(){
  const colors=[
    "#ffffff",
    "#55c2f1",
    "#f993c0",
    "#b4e5ff"
  ];

  for(let i=0;i<12;i++){
    const el=document.createElement("span");
    el.className="spark";

    const a=
      i/12*TAU+
      (Math.random()-.5)*.35;

    const distance=26+Math.random()*47;

    const set=(key,value)=>{
      el.style.setProperty(key,value);
    };

    set("--x",(31+Math.random()*38)+"%");
    set("--y",(24+Math.random()*49)+"%");
    set("--size",(5+Math.random()*7)+"px");

    set("--dx",Math.cos(a)*distance+"px");
    set("--dy",Math.sin(a)*distance+"px");
    set("--color",colors[i%colors.length]);
    set("--delay",(Math.random()*.09)+"s");
    set("--duration",(.55+Math.random()*.32)+"s");

    sparkleField.appendChild(el);

    el.addEventListener(
      "animationend",
      ()=>el.remove(),
      {once:true}
    );
  }

  while(sparkleField.children.length>100){
    sparkleField.firstElementChild.remove();
  }
}

/* REPEATED TAPS */

mascot.addEventListener("click",()=>{
  if(current!=="home"||transitioning)return;

  spring.vy=clamp(
    spring.vy-4.1,
    -12,12
  );

  spring.stretch=clamp(
    spring.stretch+.055,
    -.18,.22
  );

  spring.vs+=.018;

  if(!spring.running){
    spring.running=true;
    spring.last=0;
    requestAnimationFrame(bounceFrame);
  }

  addSparkles();
});

/* INITIAL STATE */

setScreen("loading");
</script>
</body>
</html>
